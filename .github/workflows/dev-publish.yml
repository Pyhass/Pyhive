# Manual workflow to build and publish dev Python packages from non-master branches.

name: Dev Publish

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Block master branch
    runs-on: ubuntu-latest
    steps:
      - name: Fail if running on master
        if: github.ref == 'refs/heads/master'
        run: |
          echo "::error::Dev publish is not allowed on the master branch."
          exit 1

  dev-build:
    name: Build dev package
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build package
        run: python -m build

      - name: Verify built distribution is importable
        run: python scripts/verify_dist.py dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dev-dists
          path: dist/

  dev-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: dev-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/pyhive-integration

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dev-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
