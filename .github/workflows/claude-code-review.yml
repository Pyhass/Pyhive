name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Skip:
    # - drafts
    # - fork PRs: `pull_request` runs from forks get no secrets or OIDC token,
    #   so the action cannot authenticate (use @claude via claude.yml instead)
    # - release PRs into master: huge aggregate diffs of already-reviewed work
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref != 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so Claude can `git diff` locally when the PR is too
          # large for the GitHub diff API (>20k lines).
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            You are reviewing a pull request for pyhive-integration, the Python
            library behind the Home Assistant Hive integration. Async source
            lives in `src/` (`api/`, `session/`, `devices/`, `helper/`).

            ## How to run
            - Do the review yourself in this session. Do not start sub-agents or
              background tasks: the run ends as soon as you stop, so anything
              they would post never arrives.
            - Read the PR with `gh pr view ${{ github.event.pull_request.number }} --comments`
              and `gh pr diff ${{ github.event.pull_request.number }}`. If the diff
              is too large for the API, use
              `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
              (add `--stat` or a path to narrow it). Full history is already
              checked out; no fetch is needed.
            - Read surrounding code with Read/Grep/Glob when a change is unclear.
            - Do not repeat points already raised in earlier review comments.

            ## What to look for, in priority order
            1. Correctness: logic errors, wrong or missing `await`, blocking calls
               (`requests`, `time.sleep`, sync file I/O) inside async code,
               unhandled exceptions, broken token refresh or `_retry_login` paths.
            2. Security: secrets or real credentials in code, tokens or PII in
               log output (log payloads via `HiveHelper.sanitize_payload`),
               unsafe HTTP or Cognito usage, un-anonymised data in `src/data/*.json`.
            3. Project rules:
               - Edit only the async source in `src/`. The sync `pyhiveapi`
                 package is generated by unasync; never hand-edit it.
               - Do not edit the deprecation shims (`src/heating.py` etc.); changes
                 go in `src/devices/`, `src/session/` or `src/helper/`.
               - Keep the camelCase aliases (`startSession`, `updateData`,
                 `deviceList`, `helper/compat_aliases.py`) — Home Assistant uses them.
               - The placeholder `aws_access_key_id` / `aws_secret_access_key` /
                 `aws_session_token` strings in `hive_auth_async.py` must stay;
                 do not flag them as leaked secrets.
            4. Tests: new behaviour and bug fixes need tests in `tests/unit`,
               `tests/module` or `tests/e2e`; coverage must stay at 99%. Async
               tests don't need `@pytest.mark.asyncio`.
            5. Public API: missing or wrong type hints on public methods, and
               breaking changes without a migration note.

            Skip pure style nits: ruff, pylint and mypy already run in CI.
            Only report issues you are confident about, and say why each matters.

            ## How to report
            - Post each specific finding as an inline comment on the relevant
              line with mcp__github_inline_comment__create_inline_comment.
              Include a concrete suggested fix where you can.
            - Then ALWAYS post exactly one summary comment, even if you found
              nothing or could only review part of the PR. Write it to `review.md`
              with the Write tool, then run exactly:
              `gh pr comment ${{ github.event.pull_request.number }} --body-file review.md`
              Do not use heredocs, `$(...)` or pipes in gh commands.
            - Summary format: a one-line verdict, a short bullet list of findings
              by severity (blocking / should fix / minor), and a note on anything
              you did not review. Keep it brief.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git fetch:*),Bash(git log:*),Bash(git show:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(cat:*),Read,Write,Glob,Grep"
            --disallowedTools "Agent,Task"
