name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Fork PRs get no secrets or OIDC token on `pull_request`, so the action
    # cannot authenticate there — skip them (use @claude via claude.yml instead).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the pyhive-integration Python library. Check for:
            - Correctness: logic errors, incorrect async/await usage, blocking calls in async context
            - Type annotations: missing or incorrect types on public methods
            - Security: no secrets in code, safe HTTP and Cognito API call patterns
            - Style: snake_case naming, no unused imports, ruff/pylint compliance
            - Tests: are new features or bug fixes covered by tests?

            Use `gh pr diff` and `gh pr view` to inspect the changes.
            Post inline comments on specific lines with
            mcp__github_inline_comment__create_inline_comment, then post a short
            overall summary with `gh pr comment`. Be concise.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
