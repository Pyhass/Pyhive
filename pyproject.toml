[build-system]
requires = ["setuptools>=70", "wheel", "unasync"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhive-integration"
version = "2.0.0.B1"
description = "A Python library to interface with the Hive API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "KJonline24", email = "53_galleys_snark@icloud.com" }]
keywords = ["hive", "home", "api", "library", "smart-home", "home-automation", "IoT", "async", "integration"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "boto3>=1.34,<1.38",
    "botocore>=1.34,<1.38",
    "requests",
    "aiohttp",
    "pyquery",
]

[project.urls]
Homepage = "https://github.com/Pyhive/pyhiveapi"
Source = "https://github.com/Pyhive/Pyhiveapi"
"Issue Tracker" = "https://github.com/Pyhive/Pyhiveapi/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pylint",
    "ruff",
    "mypy",
    "bandit",
    "pre-commit",
    "graphifyy",
    "unasync",
    "tokenize-rt",
]

[tool.setuptools]
# Keep this list in sync with the package directories under src/. It is explicit
# rather than auto-discovered because package-dir maps two distribution names
# (apyhiveapi, pyhive) onto the same source tree, which find: cannot express.
# The sync flavour (pyhiveapi) is generated at build time by the unasync
# build_py cmdclass in setup.py and so is not listed here.
packages = [
    "apyhiveapi",
    "apyhiveapi.api",
    "apyhiveapi.devices",
    "apyhiveapi.helper",
    "apyhiveapi.session",
    "pyhive",
    "pyhive.api",
    "pyhive.devices",
    "pyhive.helper",
    "pyhive.session",
]

[tool.setuptools.package-dir]
apyhiveapi = "src"
pyhive = "src"

[tool.setuptools.package-data]
apyhiveapi = ["data/*.json"]
pyhive = ["data/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "PL"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",  # magic values are expected in test assertions
    "PLR0913",  # test factory functions legitimately take many parameters
    "PLC0415",  # conditional/lazy imports are a valid test-isolation pattern
]

[tool.ruff.lint.isort]
known-third-party = [
    "aiohttp", "apyhiveapi", "boto3", "botocore",
    "pyquery", "requests", "setuptools", "six", "urllib3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov --cov-context=test --cov-report=lcov:coverage/lcov.info --cov-report=html:coverage/html --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
data_file = "coverage/.coverage"
omit = [
    "tests/*",
    # deprecation shims — re-export only
    "src/action.py",
    "src/boost.py",
    "src/color.py",
    "src/device_attributes.py",
    "src/heating.py",
    "src/hotwater.py",
    "src/hub.py",
    "src/light.py",
    "src/plug.py",
    "src/sensor.py",
    "src/session_discovery.py",
    "src/session_polling.py",
    "src/session_tokens.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 99
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "coverage/html"
show_contexts = true

[tool.coverage.lcov]
output = "coverage/lcov.info"

[tool.mypy]
python_version = "3.10"
show_error_codes = true
follow_imports = "silent"
ignore_missing_imports = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "requests", "requests.*", "pyquery", "pyquery.*"]
ignore_missing_imports = true
