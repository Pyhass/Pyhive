name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Fork PRs get no secrets or OIDC token on `pull_request`, so the action
    # cannot authenticate there — skip them (use @claude via claude.yml instead).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so Claude can `git diff` locally when the PR is too
          # large for the GitHub diff API (>20k lines, e.g. dev -> master).
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # TEMP: print Claude's transcript (incl. denied tool calls) to the job
          # log while debugging missing review comments. Remove once working.
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the pyhive-integration Python library. Check for:
            - Correctness: logic errors, incorrect async/await usage, blocking calls in async context
            - Type annotations: missing or incorrect types on public methods
            - Security: no secrets in code, safe HTTP and Cognito API call patterns
            - Style: snake_case naming, no unused imports, ruff/pylint compliance
            - Tests: are new features or bug fixes covered by tests?

            Use `gh pr view` and `gh pr diff` to inspect the changes. If `gh pr diff`
            fails because the diff is too large, use
            `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD` instead
            (add `--stat` or a path to narrow it down). The full history is already
            checked out, so `origin/${{ github.event.pull_request.base.ref }}` exists.

            Do the review yourself in this session — do not start sub-agents or
            background tasks. The run ends as soon as you stop, so nothing posted
            later would ever arrive.

            Post inline comments on specific lines with
            mcp__github_inline_comment__create_inline_comment.

            Finally, ALWAYS post one overall summary comment, even if you found no
            issues or could only review part of the PR. Write the summary to
            `review.md` with the Write tool, then run exactly:
            `gh pr comment ${{ github.event.pull_request.number }} --body-file review.md`
            Do not use heredocs, `$(...)`, or pipes in gh commands. Be concise.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git fetch:*),Bash(git log:*),Bash(git show:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(cat:*),Read,Write,Glob,Grep"
            --disallowedTools "Agent,Task"
