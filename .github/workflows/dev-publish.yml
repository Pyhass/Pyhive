# Manual workflow to build and publish dev Python packages from non-master branches.

name: Dev Publish

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Block master branch
    runs-on: ubuntu-latest
    steps:
      - name: Fail if running on master
        if: github.ref == 'refs/heads/master'
        run: |
          echo "::error::Dev publish is not allowed on the master branch."
          exit 1

  dev-build:
    name: Build dev package
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build package
        run: python -m build

      - name: Verify built distribution is importable
        run: python scripts/verify_dist.py dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dev-dists
          path: dist/

  dev-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: dev-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/pyhive-integration

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dev-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
