name: Tests

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/tests.yml'

# Least privilege: the default GITHUB_TOKEN is read-only.
permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxml2-dev libxslt1-dev python3-dev build-essential
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ --tb=short --no-cov

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"

      # verify_dist.py installs the wheel, which pulls pyquery -> lxml. Match the
      # tests job so a Python version without prebuilt lxml wheels can still build.
      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxml2-dev libxslt1-dev python3-dev build-essential
          python -m pip install build

      - name: Build distributions
        run: python -m build

      # The test suite runs against src/ via an editable install, so it cannot
      # see packaging mistakes. This installs the built wheel in a clean venv
      # and imports every module in it.
      - name: Verify built distribution is importable
        run: python scripts/verify_dist.py dist
